<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكار الصباح والمساء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أذكار">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d181d;--card:#152a31;--line:#22414a;--ink:#e6f3f5;--mute:#8fb0b8;--acc:#4fb3c1;--acc-ink:#062a31;--gold:#ecbb35;--gold-ink:#2b1f00;--done:#12312f;--ring:#28454e}
:root[data-theme="light"]{--bg:#eef5f6;--card:#fff;--line:#d3e3e6;--ink:#12303a;--mute:#5d7c85;--acc:#1e7f8e;--acc-ink:#fff;--gold:#e0a91f;--gold-ink:#3b2a00;--done:#e2f1e8;--ring:#cfe2e6}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;transition:background .35s,color .35s}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:1.7rem;font-weight:800;color:var(--gold)}
.theme{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--gold);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.theme svg{width:24px;height:24px;transition:transform .5s}
.theme:active svg{transform:rotate(90deg) scale(.85)}
.sun{display:none}
:root[data-theme="light"] .sun{display:block}:root[data-theme="light"] .moon{display:none}
:root:not([data-theme="light"]) .moon{display:block}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:4px;gap:4px}
.tab{font:700 .92rem Cairo,sans-serif;border:0;background:none;color:var(--mute);padding:11px 2px;border-radius:14px;cursor:pointer;transition:background .25s,color .25s}
.tab[aria-selected="true"]{background:var(--gold);color:var(--gold-ink)}
.bar{height:6px;background:var(--ring);border-radius:8px;margin:16px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:8px;transition:width .35s}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.95rem}
.meta .cnt{color:var(--mute);font-weight:600}
.meta .reset{background:none;border:0;color:var(--acc);font:700 .95rem Cairo,sans-serif;cursor:pointer;padding:4px}
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .3s,transform .12s,opacity .3s,border-color .3s}
.item:active{transform:scale(.985)}
.item:focus-visible,.tab:focus-visible,.theme:focus-visible,.reset:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.txt{font-family:Amiri,'Traditional Arabic',serif;font-size:1.25rem;line-height:2.1;margin:0}
.txt small{display:block;font:500 .85rem Cairo,sans-serif;color:var(--mute);margin-top:2px}
.badge{width:52px;height:52px;border-radius:50%;background:transparent;border:2px solid var(--acc);color:var(--acc);display:grid;place-items:center;font:800 1.3rem Cairo,sans-serif;transition:transform .15s,background .2s,color .2s,border-color .2s;flex:none}
.badge.pop{transform:scale(1.15)}
.item.cur{border-color:var(--gold)}
.item.cur .badge{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.item.done{background:var(--done);opacity:.7}
.item.done .badge{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fin{text-align:center;color:var(--acc);font-weight:700;margin:18px 0 0;min-height:1.6em}
[hidden]{display:none!important}
#tsb{text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chip{flex:none;font:600 .95rem Cairo,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.dk{font-family:Amiri,'Traditional Arabic',serif;font-size:2.1rem;margin:8px 0 4px}
.bead{position:relative;display:block;width:min(78vw,300px);aspect-ratio:1;margin:6px auto;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;user-select:none}
.bead svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--ring);stroke-width:10}
.prg{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;stroke-dasharray:741.4;stroke-dashoffset:741.4;transition:stroke-dashoffset .25s,opacity .3s}
.pearl{position:absolute;inset:9%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,#4a4a4a,#141414 55%,#000);box-shadow:0 16px 34px rgba(0,0,0,.45),inset 0 -12px 24px rgba(0,0,0,.6),inset 0 8px 16px rgba(255,255,255,.14);transition:transform .12s}
.pearl::after{content:"";position:absolute;top:11%;left:22%;width:30%;height:16%;border-radius:50%;background:rgba(255,255,255,.22);filter:blur(6px);transform:rotate(-24deg)}
.bead:active .pearl{transform:scale(.94)}
.bead:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:50%}
.pearl b{font:800 4.6rem/1 Cairo,sans-serif;color:#fff}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.sm{font:600 .95rem Cairo,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:14px;cursor:pointer}
.row2 span{color:var(--mute);font-weight:600}

/* Quran section */
.qsearch{width:100%;font:600 1rem Cairo,sans-serif;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.qsearch::placeholder{color:var(--mute)}
.qlist{display:grid;gap:10px;max-height:70vh;overflow-y:auto}
.qitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;color:var(--ink);cursor:pointer;font-family:inherit}
.qitem:active{transform:scale(.985)}
.qnum{width:38px;height:38px;border-radius:50%;border:2px solid var(--acc);color:var(--acc);display:grid;place-items:center;font:700 .9rem Cairo,sans-serif;flex:none}
.qname{font-family:Amiri,serif;font-size:1.15rem;font-weight:700}
.qmeta{font-size:.78rem;color:var(--mute);margin-top:2px}
.qarrow{color:var(--mute);font-size:1.2rem}
.qback{background:none;border:0;color:var(--acc);font:700 1rem Cairo,sans-serif;cursor:pointer;padding:6px 0;margin-bottom:8px}
.qsname{text-align:center;color:var(--gold);font-size:1.6rem;margin:4px 0 2px}
.qsinfo{text-align:center;color:var(--mute);font-size:.85rem;margin-bottom:14px}
.qbasmala{text-align:center;font-family:'Amiri Quran',Amiri,serif;font-size:1.7rem;color:var(--gold);margin:6px 0 18px}
.qtext{font-family:'Amiri Quran',Amiri,serif;font-size:1.45rem;line-height:2.6;text-align:justify;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px}
.qayah{display:inline-block;width:1.9em;height:1.9em;line-height:1.9em;text-align:center;border:1.5px solid var(--gold);border-radius:50%;color:var(--gold);font-family:Cairo,sans-serif;font-size:.72rem;font-weight:700;margin:0 2px;vertical-align:middle}
.qstate{text-align:center;color:var(--mute);padding:30px 10px}
.qretry{margin-top:10px;background:var(--acc);color:var(--acc-ink);border:0;font:700 .95rem Cairo,sans-serif;padding:10px 20px;border-radius:12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="ttl">أذكار الصباح</h1>
    <button class="theme" id="theme" aria-label="تبديل بين الليل والنهار">
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="m" aria-selected="true">الصباح</button>
    <button class="tab" role="tab" data-t="e" aria-selected="false">المساء</button>
    <button class="tab" role="tab" data-t="s" aria-selected="false">السبحة</button>
    <button class="tab" role="tab" data-t="q" aria-selected="false">القرآن</button>
  </div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="meta" id="meta">
    <span class="cnt" id="cnt"></span>
    <button class="reset" id="reset">ابدأ من جديد</button>
  </div>
  <div class="list" id="list"></div>

  <section id="tsb" hidden>
    <div class="chips" id="chips"></div>
    <div class="dk" id="dk"></div>
    <button class="bead" id="bead" aria-label="سبّح">
      <svg viewBox="0 0 260 260" aria-hidden="true"><circle class="trk" cx="130" cy="130" r="118"/><circle class="prg" id="prg" cx="130" cy="130" r="118"/></svg>
      <span class="pearl"><b id="num">0</b></span>
    </button>
    <div class="row2"><button class="sm" id="undo">تراجع</button><span id="rnd"></span><button class="sm" id="tgt"></button></div>
  </section>

  <section id="qsec" hidden>
    <div id="qlistview">
      <input type="search" class="qsearch" id="qsearch" placeholder="ابحث عن اسم السورة…">
      <div class="qlist" id="qlist"><div class="qstate">جارِ تحميل الفهرس…</div></div>
    </div>
    <div id="qreadview" hidden>
      <button class="qback" id="qback">‹ رجوع للفهرس</button>
      <div class="qsname" id="qsname"></div>
      <div class="qsinfo" id="qsinfo"></div>
      <div class="qbasmala" id="qbasmala"></div>
      <div class="qtext" id="qtext"><div class="qstate">جارِ تحميل السورة…</div></div>
    </div>
  </section>

  <p class="fin" id="fin" aria-live="polite"></p>
</main>
<script>
var D=[
["آية الكرسي",1],
["سورة الإخلاص",3],
["سورة الفلق",3],
["سورة الناس",3],
["اللَّهُمَّ مَا [أَصْبَحَ|أَمْسَى] بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",1],
["[أَصْبَحْنَا|أَمْسَيْنَا] عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",1],
["حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",7],
["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",3],
["رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ ﷺ نَبِيًّا",3],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ",3],
["[أَصْبَحْنَا وَأَصْبَحَ|أَمْسَيْنَا وَأَمْسَى] الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ] وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ] وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",1],
["اللَّهُمَّ بِكَ [أَصْبَحْنَا وَبِكَ أَمْسَيْنَا|أَمْسَيْنَا وَبِكَ أَصْبَحْنَا] وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ [النُّشُورُ|الْمَصِيرُ]",1],
["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",1],
["اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ",3],
["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ",3],
["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",1],
["اللَّهُمَّ إِنِّي [أَصْبَحْتُ|أَمْسَيْتُ] أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ",4],
["[أَصْبَحْنَا وَأَصْبَحَ|أَمْسَيْنَا وَأَمْسَى] الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ]: فَتْحَهُ، وَنَصْرَهُ، وَنُورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ",1],
["لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",100],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100],
["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",10]
];
var DATA=D.map(function(d){return {t:d[0],n:d[1]}});
function tx(x){return x.replace(/\[(.*?)\|(.*?)\]/g,function(_,a,b){return tab==="m"?a:b})}
var $=function(i){return document.getElementById(i)};
var root=document.documentElement,tab="m",left={m:[],e:[]};
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fresh(t){return DATA.map(function(d){return d.n})}
function load(){["m","e"].forEach(function(t){var s=get("adhkar-"+t),a=null;try{a=JSON.parse(s)}catch(e){}
 left[t]=(a&&a.length===DATA.length)?a:fresh(t)})}
function save(){put("adhkar-"+tab,JSON.stringify(left[tab]))}
function render(){
 var L=$("list");L.innerHTML="";
 var curIdx=-1;
 for(var k=0;k<DATA.length;k++){if(left[tab][k]>0){curIdx=k;break}}
 DATA.forEach(function(d,i){
  var r=left[tab][i],b=document.createElement("button");
  b.className="item"+(r===0?" done":"")+(i===curIdx?" cur":"");
  var txt=tx(d.t);
  b.innerHTML='<p class="txt">'+txt+(d.n>1?'<small>عدد المرات: '+d.n+'</small>':'')+'</p><span class="badge">'+(r===0?'✓':r)+'</span>';
  b.setAttribute("aria-label",txt+" — المتبقي "+r);
  b.onclick=function(){if(left[tab][i]>0){left[tab][i]--;save();render()}};
  L.appendChild(b)});
 stat();
}
function stat(){
 var done=left[tab].filter(function(x){return x===0}).length,n=DATA.length;
 $("cnt").textContent="تم "+done+" من "+n;
 $("fill").style.width=(done/n*100)+"%";
 $("fin").textContent=done===n?"تقبّل الله منك":"";
}
function setTab(t){tab=t;document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x.dataset.t===t)});show()}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
$("reset").onclick=function(){if(tab==="s"){TS.n[TS.p]=0;tsSave();tsNum();return}left[tab]=fresh(tab);save();render()};
function show(){
 var isQ=tab==="q",isS=tab==="s",isList=(tab==="m"||tab==="e");
 $("list").hidden=!isList;$("bar").hidden=!isList;$("meta").hidden=!isList;
 $("tsb").hidden=!isS;
 $("qsec").hidden=!isQ;
 $("ttl").textContent={m:"أذكار الصباح",e:"أذكار المساء",s:"السبحة",q:"القرآن الكريم"}[tab];
 $("fin").textContent="";
 if(isList)render();
 else if(isS)tsRender();
 else if(isQ)qShowList();
}
var PH=["سبحان الله","الحمد لله","الله أكبر","لا إله إلا الله","أستغفر الله","اللهم صلِّ على محمد"];
var TS={p:0,t:33,n:PH.map(function(){return 0})};
try{var sv=JSON.parse(get("adhkar-tsb"));if(sv&&sv.n&&sv.n.length===PH.length)TS=sv}catch(e){}
function tsSave(){put("adhkar-tsb",JSON.stringify(TS))}
function tsRender(){
 var c=$("chips");c.innerHTML="";
 PH.forEach(function(x,i){var b=document.createElement("button");b.className="chip";b.textContent=x;b.setAttribute("aria-pressed",i===TS.p);b.onclick=function(){TS.p=i;tsSave();$("fin").textContent="";tsRender()};c.appendChild(b)});
 tsNum();
}
function tsNum(){
 var tot=TS.n[TS.p],T=TS.t,c=T?tot%T:tot;
 $("dk").textContent=PH[TS.p];$("num").textContent=c;
 $("prg").style.strokeDashoffset=T?741.4*(1-c/T):0;
 $("prg").style.opacity=T?1:.3;
 $("tgt").textContent="الهدف: "+(T||"∞");
 $("rnd").textContent="الدورات: "+(T?Math.floor(tot/T):0);
 $("cnt").textContent="المجموع: "+tot;
}
$("bead").onclick=function(){
 TS.n[TS.p]++;tsSave();tsNum();
 var T=TS.t,done=T&&TS.n[TS.p]%T===0;
 if(navigator.vibrate)try{navigator.vibrate(done?[40,60,40]:12)}catch(e){}
 if(done){$("prg").style.strokeDashoffset=0;$("num").textContent=T;setTimeout(tsNum,450);$("fin").textContent="أتممت "+T}else $("fin").textContent="";
};
$("undo").onclick=function(){TS.n[TS.p]=Math.max(0,TS.n[TS.p]-1);tsSave();tsNum()};
$("tgt").onclick=function(){TS.t=TS.t===33?100:(TS.t===100?0:33);tsSave();tsNum()};
function isDark(){var a=root.getAttribute("data-theme");return a?a==="dark":true}
$("theme").onclick=function(){var t=isDark()?"light":"dark";root.setAttribute("data-theme",t);put("adhkar-theme",t)};
var st=get("adhkar-theme");root.setAttribute("data-theme",(st==="light")?"light":"dark");

/* ===== Quran section ===== */
var Q_API="https://api.alquran.cloud/v1/";
var surahs=null,qFiltered=null;
function arNum(n){var m=["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];return String(n).split("").map(function(c){return /[0-9]/.test(c)?m[+c]:c}).join("")}
function revAr(t){return t==="Meccan"?"مكية":"مدنية"}
function qShowList(){
 $("qreadview").hidden=true;$("qlistview").hidden=false;
 if(surahs){qRenderList(surahs);return}
 var cached=get("adhkar-surahs");
 if(cached){try{surahs=JSON.parse(cached);qRenderList(surahs)}catch(e){}}
 fetch(Q_API+"surah").then(function(r){return r.json()}).then(function(res){
  surahs=res.data;put("adhkar-surahs",JSON.stringify(surahs));qRenderList(surahs);
 }).catch(function(){
  if(!surahs)$("qlist").innerHTML='<div class="qstate">تعذّر تحميل الفهرس، تأكد من الاتصال بالإنترنت<br><button class="qretry" id="qretry">إعادة المحاولة</button></div>';
  var rb=$("qretry");if(rb)rb.onclick=qShowList;
 });
}
function qRenderList(list){
 var L=$("qlist");L.innerHTML="";
 list.forEach(function(s){
  var b=document.createElement("button");
  b.className="qitem";
  b.innerHTML='<span class="qarrow">‹</span><span><span class="qname">'+s.name+'</span><div class="qmeta">'+s.numberOfAyahs+' آية · '+revAr(s.revelationType)+'</div></span><span class="qnum">'+arNum(s.number)+'</span>';
  b.onclick=function(){qOpenSurah(s)};
  L.appendChild(b);
 });
 if(!list.length)L.innerHTML='<div class="qstate">لا توجد نتائج</div>';
}
$("qsearch").addEventListener("input",function(){
 if(!surahs)return;
 var q=this.value.trim();
 if(!q){qRenderList(surahs);return}
 qRenderList(surahs.filter(function(s){return s.name.indexOf(q)>-1||s.englishName.toLowerCase().indexOf(q.toLowerCase())>-1}));
});
$("qback").onclick=function(){$("qreadview").hidden=true;$("qlistview").hidden=false};
function qOpenSurah(s){
 $("qlistview").hidden=true;$("qreadview").hidden=false;
 $("qsname").textContent=s.name;
 $("qsinfo").textContent=s.numberOfAyahs+" آية · "+revAr(s.revelationType);
 $("qbasmala").textContent=(s.number===1||s.number===9)?"":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
 $("qtext").innerHTML='<div class="qstate">جارِ تحميل السورة…</div>';
 var cached=get("adhkar-surah-"+s.number);
 if(cached){try{qRenderSurah(JSON.parse(cached));return}catch(e){}}
 fetch(Q_API+"surah/"+s.number+"/quran-uthmani").then(function(r){return r.json()}).then(function(res){
  put("adhkar-surah-"+s.number,JSON.stringify(res.data));
  qRenderSurah(res.data);
 }).catch(function(){
  $("qtext").innerHTML='<div class="qstate">تعذّر تحميل السورة، تأكد من الاتصال بالإنترنت<br><button class="qretry" id="qretry2">إعادة المحاولة</button></div>';
  var rb=$("qretry2");if(rb)rb.onclick=function(){qOpenSurah(s)};
 });
}
function qRenderSurah(data){
 var html=data.ayahs.map(function(a){
  return a.text+' <span class="qayah">'+arNum(a.numberInSurah)+'</span>';
 }).join(" ");
 $("qtext").innerHTML=html;
}

load();setTab(new Date().getHours()>=14?"e":"m");
</script>
</body>
</html>
