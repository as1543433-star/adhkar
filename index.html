<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكار الصباح والمساء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EFDF;--ink:#2B2A22;--mute:#5E5A48;--head:#3F4B2D;--seg:#EADFC6;--track:#E3D6B8;--gold:#B58A2B;--goldtxt:#7A5710;--cardbg:#FBF6EA;--cardline:#D9C48F;--btn:#3F4B2D;--btnink:#F6EFDF;--ctl:#FBF6EA}
:root[data-theme="dark"]{--bg:#12160e;--ink:#EFE8D2;--mute:#A9A48C;--head:#C9D6A6;--seg:#1D2316;--track:#2E3622;--gold:#D4A94A;--goldtxt:#E0BC6A;--cardbg:#1A2014;--cardline:#3F4A2B;--btn:#C9D6A6;--btnink:#1B2310;--ctl:#1A2014}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;transition:background .35s,color .35s}
button{font-family:inherit;cursor:pointer}
main{max-width:480px;margin:0 auto;min-height:100dvh;padding:24px 20px 22px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:1.65rem;font-weight:800;color:var(--head)}
.hr{display:flex;align-items:center;gap:10px}
#pos{font-size:.95rem;font-weight:700;color:var(--mute)}
.theme{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--cardline);background:var(--cardbg);color:var(--goldtxt);display:grid;place-items:center;padding:0}
.theme svg{width:22px;height:22px}
.sun{display:none}
:root[data-theme="dark"] .sun{display:block}:root[data-theme="dark"] .moon{display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--seg);border-radius:16px;padding:4px}
.tab{border:0;border-radius:12px;min-height:44px;font-size:1rem;font-weight:700;background:none;color:var(--mute);transition:background .25s,color .25s}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btnink)}
.bar{height:5px;background:var(--track);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:6px;transition:width .35s}
.frame{flex:1;min-height:240px;border:1.5px solid var(--gold);border-radius:26px;padding:6px;display:flex}
.card{flex:1;display:flex;border:1px solid var(--cardline);border-radius:21px;background:var(--cardbg);color:var(--ink);padding:0;overflow:auto;text-align:center;transition:opacity .25s}
.card .in{margin:auto;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.card.done{opacity:.72}
.txt{margin:0;font-family:Amiri,'Traditional Arabic',serif;font-size:1.8rem;line-height:2.15}
.txt.m{font-size:1.5rem}.txt.s{font-size:1.28rem;line-height:2.1}
.note{font-size:.95rem;font-weight:700;color:var(--goldtxt)}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{min-height:48px;min-width:84px;padding:0 18px;border:1.5px solid var(--cardline);border-radius:14px;background:var(--ctl);color:var(--head);font-size:1rem;font-weight:700}
.nav:disabled{opacity:.4;cursor:default}
.bead{position:relative;width:112px;height:112px;border:0;background:none;padding:0;touch-action:manipulation;user-select:none;flex:none}
.bead svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg) scaleY(-1)}
.trk{fill:none;stroke:var(--track);stroke-width:7}
.prg{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;stroke-dasharray:314.16;stroke-dashoffset:314.16;transition:stroke-dashoffset .25s,opacity .3s}
.dot{position:absolute;inset:11px;border-radius:50%;background:var(--btn);color:var(--btnink);display:grid;place-items:center;font-size:2.5rem;font-weight:800;transition:transform .12s}
.bead:active .dot{transform:scale(.93)}
.link{align-self:center;background:none;border:0;color:var(--goldtxt);font-size:.95rem;font-weight:700;padding:8px 14px;min-height:40px}
.fin{text-align:center;color:var(--goldtxt);font-weight:700;margin:0;min-height:1.6em}
:is(.card,.nav,.tab,.theme,.bead,.link,.chip,.sm):focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
#tsb{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;width:100%}
.chip{flex:none;min-height:44px;font-size:.95rem;font-weight:700;border:1.5px solid var(--cardline);background:var(--cardbg);color:var(--ink);padding:0 16px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.dk{font-family:Amiri,'Traditional Arabic',serif;font-size:2.2rem;margin:10px 0 0;color:var(--ink)}
#tsb .bead{width:min(66vw,260px);height:min(66vw,260px);margin:auto}
#tsb .dot{inset:9%;font-size:4rem}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.row2 span{color:var(--mute);font-weight:700}
.sm{min-height:44px;font-size:.95rem;font-weight:700;border:1.5px solid var(--cardline);background:var(--ctl);color:var(--head);padding:0 16px;border-radius:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="ttl">أذكار الصباح</h1>
    <div class="hr">
      <span id="pos"></span>
      <button class="theme" id="theme" aria-label="تبديل بين الفاتح والداكن">
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      </button>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="m" aria-selected="true">الصباح</button>
    <button class="tab" role="tab" data-t="e" aria-selected="false">المساء</button>
    <button class="tab" role="tab" data-t="s" aria-selected="false">السبحة</button>
  </div>
  <div class="bar" id="bar"><i id="fill"></i></div>

  <section id="az" style="display:contents">
    <div class="frame"><button class="card" id="card" aria-label="اضغط للعد"><div class="in"><p class="txt" id="txt"></p><span class="note" id="note"></span></div></button></div>
    <div class="ctrl">
      <button class="nav" id="prev">السابق</button>
      <button class="bead" id="hit" aria-label="سبّح">
        <svg viewBox="0 0 112 112" aria-hidden="true"><circle class="trk" cx="56" cy="56" r="50"/><circle class="prg" id="prg" cx="56" cy="56" r="50"/></svg>
        <span class="dot" id="num">0</span>
      </button>
      <button class="nav" id="next">التالي</button>
    </div>
    <button class="link" id="reset">ابدأ من جديد</button>
  </section>

  <section id="tsb" hidden>
    <div class="chips" id="chips"></div>
    <div class="dk" id="dk"></div>
    <button class="bead" id="bead" aria-label="سبّح">
      <svg viewBox="0 0 112 112" aria-hidden="true"><circle class="trk" cx="56" cy="56" r="50"/><circle class="prg" id="tprg" cx="56" cy="56" r="50"/></svg>
      <span class="dot" id="tnum">0</span>
    </button>
    <div class="row2"><button class="sm" id="undo">تراجع</button><span id="rnd"></span><button class="sm" id="tgt"></button></div>
    <button class="link" id="treset">تصفير</button>
  </section>

  <p class="fin" id="fin" aria-live="polite"></p>
</main>
<script>
/* [نص, عدد المرات, النطاق: b=الصباح والمساء / m=الصباح فقط / e=المساء فقط] */
var D=[
["آية الكرسي",1,"b"],
["سورة الإخلاص",3,"b"],
["سورة الفلق",3,"b"],
["سورة الناس",3,"b"],
["أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",1,"m"],
["حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",7,"b"],
["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",3,"b"],
["أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",3,"e"],
["رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ ﷺ نَبِيًّا",1,"m"],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ",3,"m"],
["[أَصْبَحْنَا وَأَصْبَحَ|أَمْسَيْنَا وَأَمْسَى] الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ] وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ] وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",1,"b"],
["اللَّهُمَّ بِكَ [أَصْبَحْنَا وَبِكَ أَمْسَيْنَا|أَمْسَيْنَا وَبِكَ أَصْبَحْنَا] وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ [النُّشُورُ|الْمَصِيرُ]",1,"b"],
["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",1,"b"],
["اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ",3,"b"],
["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",1,"b"],
["[أَصْبَحْنَا وَأَصْبَحَ|أَمْسَيْنَا وَأَمْسَى] الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ]: فَتْحَهُ، وَنَصْرَهُ، وَنُورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ",1,"b"],
/* الأذكار الضعيفة — في الآخر قبل المئات */
["اللَّهُمَّ مَا [أَصْبَحَ|أَمْسَى] بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",1,"b"],
["اللَّهُمَّ إِنِّي [أَصْبَحْتُ|أَمْسَيْتُ] أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ",4,"b"],
["لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",100,"m"],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",100,"b"],
["أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100,"m"],
["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",10,"b"]
];
var DATA=D.map(function(d){return {t:d[0],n:d[1],s:d[2]}});
var $=function(i){return document.getElementById(i)};
var root=document.documentElement,tab="m",left={m:[],e:[]},view={m:0,e:0},timer=null,C=314.16;
function ar(n){return String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})}
function tx(x){return x.replace(/\[(.*?)\|(.*?)\]/g,function(_,a,b){return tab==="m"?a:b})}
function inTab(d){return d.s==="b"||d.s===tab}
function vis(){var a=[];DATA.forEach(function(d,i){if(inTab(d))a.push(i)});return a}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fresh(){return DATA.map(function(d){return d.n})}
function firstOpen(t){var p=tab;tab=t;var L=vis(),r=L[0];for(var k=0;k<L.length;k++){if(left[t][L[k]]>0){r=L[k];break}}tab=p;return r}
function load(){["m","e"].forEach(function(t){var s=get("adhkar2-"+t),a=null;try{a=JSON.parse(s)}catch(e){}
 left[t]=(a&&a.length===DATA.length)?a:fresh();
 var v=parseInt(get("adhkar3-view-"+t),10);
 view[t]=(!isNaN(v)&&DATA[v]&&(DATA[v].s==="b"||DATA[v].s===t))?v:firstOpen(t)})}
function save(){put("adhkar2-"+tab,JSON.stringify(left[tab]));put("adhkar3-view-"+tab,view[tab])}
function render(){
 var L=vis(),i=view[tab],p=L.indexOf(i),d=DATA[i],r=left[tab][i];
 var txt=tx(d.t),el=$("txt");
 el.textContent=txt;el.className="txt"+(txt.length>170?" s":txt.length>90?" m":"");
 $("note").textContent=r===0?"تم":(d.n>1?"عدد المرات: "+ar(d.n):"");
 $("card").className="card"+(r===0?" done":"");
 $("card").scrollTop=0;
 $("num").textContent=r===0?"✓":ar(r);
 $("prg").style.strokeDashoffset=C*(1-(d.n-r)/d.n);
 $("hit").setAttribute("aria-label","سبّح، المتبقي "+r);
 $("pos").textContent=ar(p+1)+" من "+ar(L.length);
 $("prev").disabled=p<=0;$("next").disabled=p>=L.length-1;
 var done=0;L.forEach(function(k){if(left[tab][k]===0)done++});
 $("fill").style.width=(done/L.length*100)+"%";
 $("fin").textContent=done===L.length?"تقبّل الله منك":"";
}
function go(step){var L=vis(),p=L.indexOf(view[tab])+step;if(p<0||p>=L.length)return;clearTimeout(timer);view[tab]=L[p];save();render()}
function hit(){
 var i=view[tab];
 if(left[tab][i]<=0)return;
 left[tab][i]--;
 var fin=left[tab][i]===0;
 if(navigator.vibrate)try{navigator.vibrate(fin?[40,60,40]:12)}catch(e){}
 save();render();
 if(fin){clearTimeout(timer);timer=setTimeout(function(){
  var L=vis(),p=L.indexOf(i),nx=-1,k;
  for(k=p+1;k<L.length;k++){if(left[tab][L[k]]>0){nx=L[k];break}}
  if(nx<0)for(k=0;k<p;k++){if(left[tab][L[k]]>0){nx=L[k];break}}
  if(nx>=0&&view[tab]===i){view[tab]=nx;save();render()}
 },450)}
}
$("hit").onclick=hit;$("card").onclick=hit;
$("prev").onclick=function(){go(-1)};$("next").onclick=function(){go(1)};
$("reset").onclick=function(){clearTimeout(timer);left[tab]=fresh();view[tab]=vis()[0];save();render()};
function setTab(t){
 clearTimeout(timer);tab=t;
 document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x.dataset.t===t)});
 var s=t==="s";
 $("az").hidden=s;$("bar").hidden=s;$("tsb").hidden=!s;$("pos").hidden=s;
 $("ttl").textContent={m:"أذكار الصباح",e:"أذكار المساء",s:"السبحة"}[t];
 $("fin").textContent="";
 if(s)tsRender();else render();
}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});

/* السبحة */
var PH=["سبحان الله","الحمد لله","الله أكبر","لا إله إلا الله","أستغفر الله","اللهم صلِّ على محمد"];
var TS={p:0,t:33,n:PH.map(function(){return 0})};
try{var sv=JSON.parse(get("adhkar-tsb"));if(sv&&sv.n&&sv.n.length===PH.length)TS=sv}catch(e){}
function tsSave(){put("adhkar-tsb",JSON.stringify(TS))}
function tsRender(){
 var c=$("chips");c.innerHTML="";
 PH.forEach(function(x,i){var b=document.createElement("button");b.className="chip";b.textContent=x;b.setAttribute("aria-pressed",i===TS.p);b.onclick=function(){TS.p=i;tsSave();$("fin").textContent="";tsRender()};c.appendChild(b)});
 tsNum();
}
function tsNum(){
 var tot=TS.n[TS.p],T=TS.t,c=T?tot%T:tot;
 $("dk").textContent=PH[TS.p];$("tnum").textContent=ar(c);
 $("tprg").style.strokeDashoffset=T?C*(1-c/T):0;
 $("tprg").style.opacity=T?1:.3;
 $("tgt").textContent="الهدف: "+(T?ar(T):"∞");
 $("rnd").textContent="الدورات: "+ar(T?Math.floor(tot/T):0)+" · المجموع: "+ar(tot);
}
$("bead").onclick=function(){
 TS.n[TS.p]++;tsSave();tsNum();
 var T=TS.t,done=T&&TS.n[TS.p]%T===0;
 if(navigator.vibrate)try{navigator.vibrate(done?[40,60,40]:12)}catch(e){}
 if(done){$("tprg").style.strokeDashoffset=0;$("tnum").textContent=ar(T);setTimeout(tsNum,450);$("fin").textContent="أتممت "+ar(T)}else $("fin").textContent="";
};
$("undo").onclick=function(){TS.n[TS.p]=Math.max(0,TS.n[TS.p]-1);tsSave();tsNum()};
$("tgt").onclick=function(){TS.t=TS.t===33?100:(TS.t===100?0:33);tsSave();tsNum()};
$("treset").onclick=function(){TS.n[TS.p]=0;tsSave();$("fin").textContent="";tsNum()};

/* الوضع الفاتح/الداكن */
function isDark(){return root.getAttribute("data-theme")==="dark"}
$("theme").onclick=function(){var t=isDark()?"light":"dark";root.setAttribute("data-theme",t);put("adhkar-theme",t)};
var st=get("adhkar-theme");
root.setAttribute("data-theme",st?(st==="dark"?"dark":"light"):((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"));
load();setTab(new Date().getHours()>=14?"e":"m");
</script>
</body>
</html>
