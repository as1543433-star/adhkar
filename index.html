<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أذكار الصباح والمساء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5f6;--card:#fff;--line:#d3e3e6;--ink:#12303a;--mute:#5d7c85;--acc:#1e7f8e;--acc-ink:#fff;--gold:#e0a91f;--gold-ink:#3b2a00;--done:#e2f1e8;--ring:#cfe2e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d181d;--card:#152a31;--line:#22414a;--ink:#e6f3f5;--mute:#8fb0b8;--acc:#4fb3c1;--acc-ink:#062a31;--gold:#ecbb35;--gold-ink:#2b1f00;--done:#12312f;--ring:#28454e}}
:root[data-theme="dark"]{--bg:#0d181d;--card:#152a31;--line:#22414a;--ink:#e6f3f5;--mute:#8fb0b8;--acc:#4fb3c1;--acc-ink:#062a31;--gold:#ecbb35;--gold-ink:#2b1f00;--done:#12312f;--ring:#28454e}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;transition:background .35s,color .35s}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:2rem;font-weight:800;color:var(--acc)}
.theme{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--gold);cursor:pointer;display:grid;place-items:center;padding:0}
.theme svg{width:24px;height:24px;transition:transform .5s}
.theme:active svg{transform:rotate(90deg) scale(.85)}
.sun{display:none}
:root[data-theme="light"] .sun{display:block}:root[data-theme="light"] .moon{display:none}
:root[data-theme="dark"] .moon{display:block}:root[data-theme="dark"] .sun{display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:4px;gap:4px}
.tab{font:700 1.05rem Cairo,sans-serif;border:0;background:none;color:var(--mute);padding:12px 4px;border-radius:14px;cursor:pointer;transition:background .25s,color .25s}
.tab[aria-selected="true"]{background:var(--acc);color:var(--acc-ink)}
.bar{height:8px;background:var(--ring);border-radius:8px;margin:16px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:8px;transition:width .35s}
.meta{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px;font-size:.95rem}
.meta .cnt{color:var(--mute);justify-self:start}
.meta .brand{font-weight:800;font-size:1.25rem;color:var(--acc);text-align:center;letter-spacing:.02em}
.meta .reset{justify-self:end;background:none;border:0;color:var(--acc);font:600 .95rem Cairo,sans-serif;text-decoration:underline;cursor:pointer;padding:6px 0}
.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:100%;text-align:right;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .3s,transform .12s,opacity .3s}
.item:active{transform:scale(.985)}
.item:focus-visible,.tab:focus-visible,.theme:focus-visible,.reset:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.txt{font-family:Amiri,'Traditional Arabic',serif;font-size:1.1rem;line-height:2;margin:0}
.txt small{display:block;font:500 .85rem Cairo,sans-serif;color:var(--mute);margin-top:2px}
.badge{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font:800 1.5rem Cairo,sans-serif;transition:transform .15s}
.badge.pop{transform:scale(1.15)}
.item.done{background:var(--done);opacity:.75}
.item.done .badge{background:var(--acc);color:var(--acc-ink)}
.fin{text-align:center;color:var(--acc);font-weight:700;margin:18px 0 0;min-height:1.6em}
[hidden]{display:none!important}
#tsb{text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chip{flex:none;font:600 .95rem Cairo,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dk{font-family:Amiri,'Traditional Arabic',serif;font-size:2.1rem;margin:8px 0 4px}
.bead{position:relative;display:block;width:min(78vw,300px);aspect-ratio:1;margin:6px auto;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;user-select:none}
.bead svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--ring);stroke-width:10}
.prg{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;stroke-dasharray:741.4;stroke-dashoffset:741.4;transition:stroke-dashoffset .25s,opacity .3s}
.pearl{position:absolute;inset:9%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--acc) 35%,#fff),var(--acc) 58%,color-mix(in srgb,var(--acc) 62%,#000));box-shadow:0 16px 36px color-mix(in srgb,var(--acc) 45%,transparent),inset 0 -12px 24px rgba(0,0,0,.2),inset 0 10px 18px rgba(255,255,255,.4);transition:transform .12s}
.pearl::after{content:"";position:absolute;top:11%;left:22%;width:30%;height:16%;border-radius:50%;background:rgba(255,255,255,.4);filter:blur(6px);transform:rotate(-24deg)}
.bead:active .pearl{transform:scale(.94)}
.bead:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:50%}
.pearl b{font:800 4.6rem/1 Cairo,sans-serif;color:var(--acc-ink)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.sm{font:600 .95rem Cairo,sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:14px;cursor:pointer}
.row2 span{color:var(--mute);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="ttl">أذكار الصباح</h1>
    <button class="theme" id="theme" aria-label="تبديل بين الليل والنهار">
      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    </button>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="m" aria-selected="true">الصباح</button>
    <button class="tab" role="tab" data-t="e" aria-selected="false">المساء</button>
    <button class="tab" role="tab" data-t="s" aria-selected="false">السبحة</button>
  </div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="meta">
    <span class="cnt" id="cnt"></span>
    <span class="brand">الجبرتي</span>
    <button class="reset" id="reset">ابدأ من جديد</button>
  </div>
  <div class="list" id="list"></div>
  <section id="tsb" hidden>
    <div class="chips" id="chips"></div>
    <div class="dk" id="dk"></div>
    <button class="bead" id="bead" aria-label="سبّح">
      <svg viewBox="0 0 260 260" aria-hidden="true"><circle class="trk" cx="130" cy="130" r="118"/><circle class="prg" id="prg" cx="130" cy="130" r="118"/></svg>
      <span class="pearl"><b id="num">0</b></span>
    </button>
    <div class="row2"><button class="sm" id="undo">تراجع</button><span id="rnd"></span><button class="sm" id="tgt"></button></div>
  </section>
  <p class="fin" id="fin" aria-live="polite"></p>
</main>
<script>
// كل ذكر: [النص, عدد المرات] — الأقواس [صباح|مساء] بتتبدّل حسب التاب
var D=[
["آية الكرسي",1],
["سورة الإخلاص",3],
["سورة الفلق",3],
["سورة الناس",3],
["اللَّهُمَّ مَا [أَصْبَحَ|أَمْسَى] بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ",1],
["[أَصْبَحْنَا|أَمْسَيْنَا] عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ",1],
["حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",7],
["بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",3],
["رَضِيتُ بِاللَّهِ رَبًّا وَبِالْإِسْلَامِ دِينًا وَبِمُحَمَّدٍ ﷺ نَبِيًّا",3],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَا نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ",3],
["[أَصْبَحْنَا وَأَصْبَحَ|أَمْسَيْنَا وَأَمْسَى] الْمُلْكُ لِلَّهِ وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ] وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ] وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",1],
["اللَّهُمَّ بِكَ [أَصْبَحْنَا وَبِكَ أَمْسَيْنَا|أَمْسَيْنَا وَبِكَ أَصْبَحْنَا] وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ [النُّشُورُ|الْمَصِيرُ]",1],
["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءًا أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ",1],
["اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَأَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ",3],
["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ",3],
["اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",1],
["اللَّهُمَّ إِنِّي [أَصْبَحْتُ|أَمْسَيْتُ] أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ",4],
["[أَصْبَحْنَا وَأَصْبَحَ|أَمْسَيْنَا وَأَمْسَى] الْمُلْكُ لِلَّهِ رَبِّ الْعَالَمِينَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ [هَذَا الْيَوْمِ|هَذِهِ اللَّيْلَةِ]: فَتْحَهُ، وَنَصْرَهُ، وَنُورَهُ، وَبَرَكَتَهُ، وَهُدَاهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِيهِ وَشَرِّ مَا بَعْدَهُ",1],
["لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",100],
["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100],
["اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",10]
];
var DATA=D.map(function(d){return {t:d[0],n:d[1]}});
function tx(x){return x.replace(/\[(.*?)\|(.*?)\]/g,function(_,a,b){return tab==="m"?a:b})}
var $=function(i){return document.getElementById(i)};
var root=document.documentElement,tab="m",left={m:[],e:[]};
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fresh(t){return DATA.map(function(d){return d.n})}
function load(){["m","e"].forEach(function(t){var s=get("adhkar-"+t),a=null;try{a=JSON.parse(s)}catch(e){}
 left[t]=(a&&a.length===DATA.length)?a:fresh(t)})}
function save(){put("adhkar-"+tab,JSON.stringify(left[tab]))}
function render(){
 var L=$("list");L.innerHTML="";
 DATA.forEach(function(d,i){
  var r=left[tab][i],b=document.createElement("button");
  b.className="item"+(r===0?" done":"");
  var txt=tx(d.t);
  b.innerHTML='<p class="txt">'+txt+(d.n>1?'<small>عدد المرات: '+d.n+'</small>':'')+'</p><span class="badge">'+(r===0?'✓':r)+'</span>';
  b.setAttribute("aria-label",txt+" — المتبقي "+r);
  b.onclick=function(){if(left[tab][i]>0){left[tab][i]--;save();update(b,i)}};
  L.appendChild(b)});
 stat();
}
function update(b,i){
 var r=left[tab][i],bd=b.querySelector(".badge");
 bd.textContent=r===0?"✓":r;bd.classList.add("pop");setTimeout(function(){bd.classList.remove("pop")},150);
 if(r===0){b.classList.add("done");if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}}
 stat();
}
function stat(){
 var done=left[tab].filter(function(x){return x===0}).length,n=DATA.length;
 $("cnt").textContent="تم "+done+" من "+n;
 $("fill").style.width=(done/n*100)+"%";
 $("fin").textContent=done===n?"تقبّل الله منك":"";
}
function setTab(t){tab=t;document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",x.dataset.t===t)});show()}
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){setTab(b.dataset.t)}});
$("reset").onclick=function(){if(tab==="s"){TS.n[TS.p]=0;tsSave();tsNum();return}left[tab]=fresh(tab);save();render()};
function show(){
 var s=tab==="s";
 $("list").hidden=s;$("bar").hidden=s;$("tsb").hidden=!s;
 $("ttl").textContent={m:"أذكار الصباح",e:"أذكار المساء",s:"السبحة"}[tab];
 $("reset").textContent=s?"تصفير":"ابدأ من جديد";
 $("fin").textContent="";
 if(s)tsRender();else render();
}
var PH=["سبحان الله","الحمد لله","الله أكبر","لا إله إلا الله","أستغفر الله","اللهم صلِّ على محمد"];
var TS={p:0,t:33,n:PH.map(function(){return 0})};
try{var sv=JSON.parse(get("adhkar-tsb"));if(sv&&sv.n&&sv.n.length===PH.length)TS=sv}catch(e){}
function tsSave(){put("adhkar-tsb",JSON.stringify(TS))}
function tsRender(){
 var c=$("chips");c.innerHTML="";
 PH.forEach(function(x,i){var b=document.createElement("button");b.className="chip";b.textContent=x;b.setAttribute("aria-pressed",i===TS.p);b.onclick=function(){TS.p=i;tsSave();$("fin").textContent="";tsRender()};c.appendChild(b)});
 tsNum();
}
function tsNum(){
 var tot=TS.n[TS.p],T=TS.t,c=T?tot%T:tot;
 $("dk").textContent=PH[TS.p];$("num").textContent=c;
 $("prg").style.strokeDashoffset=T?741.4*(1-c/T):0;
 $("prg").style.opacity=T?1:.3;
 $("tgt").textContent="الهدف: "+(T||"∞");
 $("rnd").textContent="الدورات: "+(T?Math.floor(tot/T):0);
 $("cnt").textContent="المجموع: "+tot;
}
$("bead").onclick=function(){
 TS.n[TS.p]++;tsSave();tsNum();
 var T=TS.t,done=T&&TS.n[TS.p]%T===0;
 if(navigator.vibrate)try{navigator.vibrate(done?[40,60,40]:12)}catch(e){}
 if(done){$("prg").style.strokeDashoffset=0;$("num").textContent=T;setTimeout(tsNum,450);$("fin").textContent="أتممت "+T}else $("fin").textContent="";
};
$("undo").onclick=function(){TS.n[TS.p]=Math.max(0,TS.n[TS.p]-1);tsSave();tsNum()};
$("tgt").onclick=function(){TS.t=TS.t===33?100:(TS.t===100?0:33);tsSave();tsNum()};
function isDark(){var a=root.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme:dark)").matches}
$("theme").onclick=function(){var t=isDark()?"light":"dark";root.setAttribute("data-theme",t);put("adhkar-theme",t)};
var st=get("adhkar-theme");if(st==="light"||st==="dark")root.setAttribute("data-theme",st);
else root.setAttribute("data-theme",isDark()?"dark":"light");
load();setTab(new Date().getHours()>=14?"e":"m");
</script>
